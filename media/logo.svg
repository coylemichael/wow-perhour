<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- PerHour logo: a gold coin that is also a clock face.
       Edit in any text editor, Inkscape or Figma, then export to logo.png:
         magick media/logo.svg media/logo.png
       Move a hand by changing its rotate() angle (0 = 12 o'clock, 90 = 3 o'clock). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5C1216"/>
      <stop offset="1" stop-color="#26060A"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- coin: rim, face and inner ring -->
  <circle cx="256" cy="256" r="180" fill="#A8761E"/>
  <circle cx="256" cy="256" r="162.5" fill="#ECBE48"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#A8761E" stroke-width="4.5"/>

  <!-- hour marks: thick at 12, 3, 6 and 9 -->
  <g stroke="#5A3208">
    <g stroke-width="11">
      <line x1="256" y1="126" x2="256" y2="148.5" transform="rotate(0 256 256)"/>
      <line x1="256" y1="126" x2="256" y2="148.5" transform="rotate(90 256 256)"/>
      <line x1="256" y1="126" x2="256" y2="148.5" transform="rotate(180 256 256)"/>
      <line x1="256" y1="126" x2="256" y2="148.5" transform="rotate(270 256 256)"/>
    </g>
    <g stroke-width="6.5">
      <line x1="256" y1="126" x2="256" y2="138.5" transform="rotate(30 256 256)"/>
      <line x1="256" y1="126" x2="256" y2="138.5" transform="rotate(60 256 256)"/>
      <line x1="256" y1="126" x2="256" y2="138.5" transform="rotate(120 256 256)"/>
      <line x1="256" y1="126" x2="256" y2="138.5" transform="rotate(150 256 256)"/>
      <line x1="256" y1="126" x2="256" y2="138.5" transform="rotate(210 256 256)"/>
      <line x1="256" y1="126" x2="256" y2="138.5" transform="rotate(240 256 256)"/>
      <line x1="256" y1="126" x2="256" y2="138.5" transform="rotate(300 256 256)"/>
      <line x1="256" y1="126" x2="256" y2="138.5" transform="rotate(330 256 256)"/>
    </g>
  </g>

  <!-- hands and hub -->
  <g stroke="#462406">
    <line id="hour-hand" x1="256" y1="256" x2="256" y2="181" stroke-width="17.5" transform="rotate(300 256 256)"/>
    <line id="minute-hand" x1="256" y1="256" x2="256" y2="143.5" stroke-width="12" transform="rotate(50 256 256)"/>
  </g>
  <circle cx="256" cy="256" r="15" fill="#462406"/>
</svg>
